<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Overlapping Items</title>
</head>
<body>
    <div class="flag swis" onclick="moveTop(this)">
        <div class="hor-ban"></div>
        <div class="vert-ban"></div>
    </div>
    
    <div class="flag isr" onclick="moveTop(this)">
        <div class="top-ban"></div>
        <div class="star"><img src="img/isr.svg" alt="isr" class="star-img"></div>
        <div class="bot-ban"></div>
    </div>
    <div class="flag palulu"  onclick="moveTop(this)">
        <div class="circle"></div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
