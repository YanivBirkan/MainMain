<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkbox Hack</title>

<body>

    <h1>Checkbox Hack</h1>
    <h1>Checkbox Hack</h1>

    <!-- :The :checked pseudo class -->
    <div class="example example1">
        <input id="checkbox1" type="checkbox" />
        <label for="checkbox1">Just a checkbox</label>
    </div>

    <!-- :Basic Example -->

    <div class="example example2">
        <label for="toggle">I'm the <span>&lt;label&gt;</span></label>
        <input type="checkbox" id="toggle" />
        <div class="control-me">Control me</div>
    </div>
    
    
    <!-- :Pill Checkbox Example -->
    
    <div class="example example3">
        <input id="pill-checkbox" type="checkbox" />
        <label class="pill-checkbox-label" for="pill-checkbox">
            <div></div>
        </label>
    </div>
