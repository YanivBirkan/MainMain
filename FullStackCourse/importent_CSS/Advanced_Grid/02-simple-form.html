<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Draggable Text and Line</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }
        canvas { border: 2px solid #333; background: #fff; cursor: default; }
    </style>
</head>
<body>

<canvas id="canvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// State tracking
let isDragging = false;
let dragTarget = null; // 'text', 'lineStart', or 'lineEnd'
let dragOffset = { x: 0, y: 0 };

// Elements data
const textItem = { x: 200, y: 100, text: "Drag Me Everywhere!", size: 24, width: 0, height: 24 };
const lineItem = { startX: 100, startY: 250, endX: 400, endY: 250, handleRadius: 8 };

// Load background image
const bgImage = new Image();
bgImage.src = 'https://picsum.photos'; // Placeholder image
bgImage.onload = () => draw();

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 1. Draw Background Image
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

    // 2. Draw Line
    ctx.beginPath();
    ctx.moveTo(lineItem.startX, lineItem.startY);
    ctx.lineTo(lineItem.endX, lineItem.endY);
    ctx.strokeStyle = '#ff0000';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Draw Line Drag Handles
    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(lineItem.startX, lineItem.startY, lineItem.handleRadius, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(lineItem.endX, lineItem.endY, lineItem.handleRadius, 0, Math.PI * 2); ctx.fill();

    // 3. Draw Text
    ctx.font = `${textItem.size}px Arial`;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    
    // Measure text width dynamically for collision checking
    textItem.width = ctx.measureText(textItem.text).width;
    
    // Text drop shadow effect for visibility on images
    ctx.strokeText(textItem.text, textItem.x, textItem.y);
    ctx.fillText(textItem.text, textItem.x, textItem.y);
}

// Distance helper helper for circles
function getDistance(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

// Mouse Event Listeners
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Check hit on Line Start handle
    if (getDistance(mouseX, mouseY, lineItem.startX, lineItem.startY) <= lineItem.handleRadius) {
        isDragging = true;
        dragTarget = 'lineStart';
        return;
    }

    // Check hit on Line End handle
    if (getDistance(mouseX, mouseY, lineItem.endX, lineItem.endY) <= lineItem.handleRadius) {
        isDragging = true;
        dragTarget = 'lineEnd';
        return;
    }

    // Check hit on Text bounding box
    if (mouseX >= textItem.x && mouseX <= textItem.x + textItem.width &&
        mouseY >= textItem.y && mouseY <= textItem.y + textItem.height) {
        isDragging = true;
        dragTarget = 'text';
        dragOffset.x = mouseX - textItem.x;
        dragOffset.y = mouseY - textItem.y;
        return;
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // Update cursor style on hover
    const overStart = getDistance(mouseX, mouseY, lineItem.startX, lineItem.startY) <= lineItem.handleRadius;
    const overEnd = getDistance(mouseX, mouseY, lineItem.endX, lineItem.endY) <= lineItem.handleRadius;
    const overText = mouseX >= textItem.x && mouseX <= textItem.x + textItem.width &&
                     mouseY >= textItem.y && mouseY <= textItem.y + textItem.height;

    if (overStart || overEnd || overText || isDragging) {
        canvas.style.cursor = 'move';
    } else {
        canvas.style.cursor = 'default';
    }

    if (!isDragging) return;

    // Move the selected element
    if (dragTarget === 'text') {
        textItem.x = mouseX - dragOffset.x;
        textItem.y = mouseY - dragOffset.y;
    } else if (dragTarget === 'lineStart') {
        lineItem.startX = mouseX;
        lineItem.startY = mouseY;
    } else if (dragTarget === 'lineEnd') {
        lineItem.endX = mouseX;
        lineItem.endY = mouseY;
    }

    draw();
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
    dragTarget = null;
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
    dragTarget = null;
});
</script>

</body>
</html>
