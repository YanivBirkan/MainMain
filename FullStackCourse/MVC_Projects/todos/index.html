<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Todos</title>
  </head>
  <body onload="onInit()">
    <h1>Todos</h1>
    <section class="todo-filter">
      <select title="select" onchange="onSetFilter(this.value)">
        <option value="all">All</option>
        <option value="active">Active</option>
        <option value="done">Done</option>
      </select>
    </section>
    <ul class="todo-list">
    </ul>
    <section class="todo-add">
        <input class="todo-input" type="text" name="todo-txt" placeholder="Add a new todo">
        <button onclick="onAddTodo()" title="btn" class="add-btn">Add</button>
    </section>
    <script src="js/services/todo-service.js"></script>
    <script src="js/services/util.js"></script>
    <script src="js/controler.js"></script>
  </body>
</html>
