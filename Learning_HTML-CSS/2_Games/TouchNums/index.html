<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="onInit()">
    <div class="board">
        <h1>Touch the Numbers</h1>
        <h3>Next number: <span class="nextNumber">1</span></h3>
        <h3>Time: <span class="timeSpan">00:00</span></h3>
        <div class="buttons">
            <button class="btn btn-success" onclick="onCHangeDificulty(2)">Supper Easy</button>
            <button class="btn btn-success" onclick="onCHangeDificulty(3)">Easy</button>
            <button class="btn btn-success" onclick="onCHangeDificulty(4)">Noraml</button>
            <button class="btn btn-success" onclick="onCHangeDificulty(5)">Hard</button>

        </div>
            <table class="game-table">
                <tbody class="board-table">
                    <!-- <tr>
                        <td class="td-box">1</td>
                        <td class="td-box">2</td>
                    </tr>
                    <tr>
                        <td class="td-box">3</td>
                        <td class="td-box">4</td>
                    </tr> -->
                </tbody>
            </table>
        <div class="victory hide">
            <h2>You touched all the numbers!</h2>
            <button class="btn btn-info restart" onclick="onInit()">Restart</button>
        </div>
    </div>

    <script src="Js/main.js"></script>
</body>
</html>
