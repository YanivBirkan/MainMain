<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Cinema Project</title>
        <link rel="stylesheet" href="css/main1.css" />
    </head>

    <body onload="onInit()">

        <h1>Popcorn Time</h1>
        
        <table class="cinema">
            <tbody class="cinema-seats"> </tbody>
        </table>

        <div hidden class="popup">
            <button class="btn btn-close"
            data-i=""
            data-j=""
            onclick="closePop(this)">x</button>
            <h2>Seat: <span>X-X</span></h2>
            <h3>Price: $<span>X</span></h3>
            <h4>Available seats: <span>0</span></h4>
            <button
                class="btn btn-book-seat"
                data-i=""
                data-j=""
                onclick="onBookSeat(this)">Book this Seat</button>
            <button class="btn btn-flash"
                data-i=""
                data-j=""
                onclick="check(this)">🔦</button>
            
        </div>
        
        <script src="js/main1.js"></script>
    </body>
</html>
